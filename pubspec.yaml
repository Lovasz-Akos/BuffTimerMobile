name: buff_timer_mobile
description: "FF14 FC Buff Timer Android App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  permission_handler: ^13.0.1
  intl: ^0.20.3
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
